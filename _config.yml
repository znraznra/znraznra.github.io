# ------------------------------------------------------------------
# Site settings — edit these
# ------------------------------------------------------------------
title: "Znra | Blog"
description: "Personal projects, experiments, ramblings, and so on."
url: "https://blog.znra.fyi"     # your Porkbun domain, no trailing slash
baseurl: ""                        # leave blank unless served from a subpath
author: "Znra"
github_username: "znraznra"
github_repo: "znraznra.github.io"

# Shown as a row of links in the footer — name each one however you like,
# add or remove entries freely, point them wherever you want (social
# profiles, an email link via "mailto:you@yourdomain.com", your RSS feed
# at "/feed.xml", etc.).
footer_links:
  - name: "Youtube"
    url: "https://youtube.com/@mellyexe"
  - name: "Be a Patron"
    url: "https://patreon.com/mellyexe"
  - name: "Buy me a coffee"
    url: "https://patreon.com/mellyexe"
# ------------------------------------------------------------------
# Build settings — leave as-is unless you know why you're changing it
# ------------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: /:year/:month/:day/:title/

collections:
  pages:
    output: true
    permalink: /:path/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

feed:
  path: feed.xml

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor

show_drafts: false

# Without these, Jekyll reads any post date with no timezone offset as UTC.
# Since posts are written in Manila time, that mismatch can make a
# same-day post look like it's "in the future" until real UTC time
# catches up — and future-dated posts are silently excluded from the
# build by default. This fixes that permanently.
timezone: Asia/Manila
future: true

