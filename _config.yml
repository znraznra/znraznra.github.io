# ------------------------------------------------------------------
# Site settings — edit these
# ------------------------------------------------------------------
title: "Your Blog Name"
description: "A short line about what you write about here."
url: "https://yourdomain.com"     # your Porkbun domain, no trailing slash
baseurl: ""                        # leave blank unless served from a subpath
author: "Your Name"
github_username: "yourusername"
github_repo: "your-repo"

# Shown as a row of links in the footer — name each one however you like,
# add or remove entries freely, point them wherever you want (social
# profiles, an email link via "mailto:you@yourdomain.com", your RSS feed
# at "/feed.xml", etc.).
footer_links:
  - name: "Link 1"
    url: "https://example.com"
  - name: "Link 2"
    url: "https://example.com"

# ------------------------------------------------------------------
# Build settings — leave as-is unless you know why you're changing it
# ------------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: /:year/:month/:day/:title/

collections:
  pages:
    output: true
    permalink: /:path/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

feed:
  path: feed.xml

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor

show_drafts: false
