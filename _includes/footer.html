<footer class="footer site-footer">
  <div class="container">
    <div class="site-footer-inner">
      <p>&copy; {{ site.time | date: '%Y' }} {{ site.author | default: site.title }}. All rights reserved.</p>
      {% if site.footer_links.size > 0 %}
        <p class="site-footer-links">
          {% for link in site.footer_links %}
            <a href="{{ link.url }}">{{ link.name }}</a>{% unless forloop.last %}<span class="site-footer-dot" aria-hidden="true">&middot;</span>{% endunless %}
          {% endfor %}
        </p>
      {% endif %}
    </div>
  </div>
</footer>
